name: Release

on:
  push:
    tags:
      - 'v2.[0-9]+.[0-9]+'
      - 'v2.[0-9]+.[0-9]+-*'

permissions:
  contents: write

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v3.0.0-beta.23'
  TASK_VERSION: 'v3.53.1'

jobs:
  release:
    name: Build and publish the Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Use an npm that honours the release-age gate
        run: npm install -g npm@11.19.1

      - name: Install Task
        shell: bash
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build application
        shell: bash
        run: task build VERSION=${{ steps.meta.outputs.version }}

      - name: Package installer
        shell: bash
        run: task package VERSION=${{ steps.meta.outputs.version }}

      - name: Package companion plugin
        shell: bash
        run: task plugin:zip

      - name: List build output
        run: Get-ChildItem -Path bin -Recurse

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            bin/postulator.exe
            bin/postulator-amd64-installer.exe
            bin/postulator-companion.zip
