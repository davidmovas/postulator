name: CI

on:
  push:
    branches:
      - master
      - dev
      - rewrite/v2
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v3.0.0-beta.23'
  GOLANGCI_LINT_VERSION: 'v2.13.2'
  TASK_VERSION: 'v3.53.1'

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Generate the TypeScript bindings
        run: task bindings

      - name: Install the frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck the frontend against the bindings
        working-directory: frontend
        run: npm run typecheck

      - name: Build application
        run: task build

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: go run ./cmd/covergate -profile coverage.out

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: postulator
          path: bin/postulator.exe

  plugin:
    name: Companion plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Show the PHP version
        run: php -v

      - name: Lint the end-to-end sources
        run: task lint:e2e

      - name: Lint the plugin
        run: task plugin:lint

      - name: Package the plugin
        run: task plugin:zip

      - name: Upload the plugin package
        uses: actions/upload-artifact@v4
        with:
          name: postulator-companion
          path: bin/postulator-companion.zip
