name: postulator-test-vanilla

x-wordpress-image: &wordpress-image ${WP_IMAGE:-wordpress:7.0.1-php8.3-apache}
x-cli-image: &cli-image ${WP_CLI_IMAGE:-wordpress:cli-2.12.0-php8.3}

x-php: &php
  profiles:
    - tools
  entrypoint: ["/bin/sh"]
  volumes:
    - ../../wp-plugin:/plugin:ro

services:
  db:
    image: mariadb:11.4.12
    environment:
      MARIADB_ROOT_PASSWORD: postulator-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: *wordpress-image
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WP_ENVIRONMENT_TYPE: local
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/wp-login.php\") === false ? 1 : 0);'"]
      interval: 5s
      timeout: 10s
      retries: 40

  bootstrap:
    image: *cli-image
    profiles:
      - tools
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WP_ENVIRONMENT_TYPE: local
      STAND: ${STAND:-vanilla}
      E2E_MODE: ${E2E_MODE:-test}
      E2E_PROJECT: ${E2E_PROJECT:-postulator-test-vanilla}
      E2E_PROVISION: ${E2E_PROVISION:-0}
      E2E_SITE_URL: http://localhost:${WP_PORT:-8088}
      E2E_ADMIN_USER: ${E2E_ADMIN_USER:-}
      E2E_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:-}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-}
      E2E_SEO: ${E2E_SEO:-}
      E2E_WOO: ${E2E_WOO:-1}
      E2E_PLUGIN: ${E2E_PLUGIN:-}
      E2E_WP_IMAGE: *wordpress-image
      E2E_WP_CLI_IMAGE: *cli-image
    entrypoint: ["/bin/sh", "/e2e/bootstrap.sh"]
    volumes:
      - wp:/var/www/html
      - ./:/e2e
      - ../../bin:/dist:ro

  php72:
    <<: *php
    image: php:7.2.34-cli

  php74:
    <<: *php
    image: php:7.4.33-cli

  php85:
    <<: *php
    image: php:8.5.12-cli

volumes:
  db:
  wp:
