version: '3'

info:
  companyName: "Postulator"
  productName: "Postulator"
  productIdentifier: "com.postulator.app"
  description: "Entity-graph driven WordPress content factory"
  copyright: "(c) 2026, Postulator"
  comments: "Turns an entity graph into graph-compliant WordPress pages"
  version: "2.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - docs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
