version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Windows executable into bin/
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" ./cmd/postulator
      - powershell -NoProfile -Command "Remove-Item -Force -ErrorAction SilentlyContinue cmd/postulator/*.syso"
    vars:
      LDFLAGS_VERSION: '-X {{.MODULE}}/internal/app.Version={{.VERSION}} -X {{.MODULE}}/internal/app.Commit={{.COMMIT}} -X {{.MODULE}}/internal/app.BuildDate={{.BUILD_DATE}}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l" -ldflags="{{.LDFLAGS_VERSION}}"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui {{.LDFLAGS_VERSION}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '0'
      GOARCH: '{{.ARCH | default ARCH}}'

  run:
    summary: Runs the built executable
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  generate:syso:
    summary: Generates the Windows resource object
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../cmd/postulator/wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Builds the NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
